services:
  blog:
    build: .
    ports:
      # Host port is configurable so prod and dev can coexist.
      - "${BLOG_PORT:-4246}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
